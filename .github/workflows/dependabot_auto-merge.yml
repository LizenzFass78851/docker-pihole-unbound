name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

env:
  dependency-name: 'pihole/pihole'
  gh_token: ${{ github.token }}

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'LizenzFass78851/docker-pihole-unbound'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ env.gh_token }}"
      - name: Enable auto-merge for Dependabot PRs
        if: contains(steps.metadata.outputs.dependency-names, '${{ env.dependency-name }}')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{ env.gh_token }}
