name: Build as Matrix and Publish Docker Image

on:
  schedule:
    - cron: '10 14 */3 * 2'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_amd64_arm64_arm:
    strategy:
      fail-fast: false
      matrix:
        target: ["stable", "oldstable", "beta"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Dockerfile
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target }}

      - name: Determine QEMU Tag
        id: determine-qemu-tag
        run: |
          echo "qemu_tag=latest" >> $GITHUB_OUTPUT
          if [ -e Dockerfile ]; then
            DOCKERFILE_TAG=$(grep -oP '(?<=^FROM pihole/pihole:).*' Dockerfile)
            if [[ "$DOCKERFILE_TAG" < "2024.07.00" ]]; then
              echo "qemu_tag=qemu-v7.0.0-28" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:${{ steps.determine-qemu-tag.outputs.qemu_tag }}
          platforms: all
      
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        id: ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ startsWith(env.TARGET_BRANCH, 'refs/heads/stable') }}
          tags: ${{ matrix.target }}

      - name: Build and push main Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          build-args: GH_TOKEN=${{ github.token }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          cache-to: type=gha,mode=max,ignore-error=true
          cache-from: type=gha
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
