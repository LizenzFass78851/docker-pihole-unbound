name: Build as Matrix and Publish Docker Image

on:
  schedule:
    - cron: '20 14 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build_matrix:
    strategy:
      fail-fast: false
      matrix:
        target: ["stable", "beta", "oldstable"]

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Dockerfile
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target }}

      - name: Determine Tags
        shell: bash
        id: determine-tags
        run: |
          if [ -e Dockerfile ]; then
            DOCKERFILE_TAG=$(grep -oP '(?<=^FROM pihole/pihole:).*' Dockerfile)
            if [[ "$DOCKERFILE_TAG" < "2024.07.00" ]]; then
              echo "QEMU_TAG=qemu-v7.0.0-28" >> $GITHUB_OUTPUT
              echo "PLATRORMS=linux/amd64,linux/386,linux/arm64,linux/arm/v7" >> $GITHUB_OUTPUT
            else
              echo "QEMU_TAG=latest" >> $GITHUB_OUTPUT
              echo "PLATRORMS=linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6,linux/riscv64" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:${{ steps.determine-tags.outputs.QEMU_TAG }}
          platforms: all
      
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        id: ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ matrix.target == 'stable' }}
          tags: ${{ matrix.target }}

      - name: Build and push main Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          build-args: GH_TOKEN=${{ github.token }}
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.determine-tags.outputs.PLATRORMS }}
          cache-to: type=gha,mode=max,ignore-error=true
          cache-from: type=gha
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
